<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكلات جازان الشعبية</title>
    <!-- ربط خط تاجويل من قوقل -->
    <link rel="preconnect" href="googleapis.com">
    <link rel="preconnect" href="gstatic.com" crossorigin>
    <link href="googleapis.com" rel="stylesheet">
    <!-- ربط ملف الستايل -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="overlay">
            <h1>المطبخ الجيزاني الأصيل</h1>
        </div>
    </header>

    <div class="container">
        <div class="intro">
            <h2>أشهر الأطباق الشعبية</h2>
        </div>

        <div class="food-grid">
            <!-- كرت المغش -->
            <div class="card">
                <div class="card-img-wrapper">
                    <img src="maghsh.jpg" alt="المغش الجيزاني" class="card-img">
                </div>
                <div class="card-content">
                    <h3>المغش</h3>
                    <p>لحم وخضار مطبوخ داخل برمة حجرية في التنور التقليدي.</p>
                </div>
            </div>

            <!-- كرت المرسة -->
            <div class="card">
                <div class="card-img-wrapper">
                    <img src="marsah.jpg" alt="المرسة الجيزانية" class="card-img">
                </div>
                <div class="card-content">
                    <h3>المرسة</h3>
                    <p>مزيج رائع من خبز البر المهروس مع الموز، السمن البلدي، والعسل الأبيض.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

</body>
</html>
